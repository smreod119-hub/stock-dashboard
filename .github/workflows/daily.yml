name: 매일 대시보드 갱신

on:
  schedule:
    # 한국시간 화~토 오전 7:17 (미국 장 마감 후). cron은 UTC 기준입니다.
    - cron: "17 22 * * 1-5"
  workflow_dispatch: {}   # Actions 탭에서 'Run workflow' 버튼으로 수동 실행

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python scripts/update.py
      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "데이터 갱신 $(date -u +%Y-%m-%d)"
          git push
